# ~/.config/hypr/hyprlock.conf
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

# ------------------------------------------------------------------------- #
#  Variables (paleta y fuentes alineadas con barba/lookandfeel.lua)
# ------------------------------------------------------------------------- #
$font        = CaskaydiaCove Nerd Font
$font_ui     = Rubik

$accent      = rgba(33ccffee)
$accent_alt  = rgba(00ff99ee)
$fg          = rgba(ebebebff)
$fg_dim      = rgba(bfbfbfcc)
$surface     = rgba(1a1a1acc)
$warn        = rgba(ffaa33ee)
$error       = rgba(ff3355ee)

# ------------------------------------------------------------------------- #
#  General
# ------------------------------------------------------------------------- #
general {
    hide_cursor = true
    ignore_empty_input = true      # Enter en vacío no cuenta como intento fallido
    immediate_render = true        # dibuja los widgets sin esperar el fondo
    text_trim = true
    fractional_scaling = 2         # 0 off / 1 on / 2 auto
    screencopy_mode = 0            # 0 GPU / 1 CPU (lento)
    fail_timeout = 2000
}

# ------------------------------------------------------------------------- #
#  Autenticación
# ------------------------------------------------------------------------- #
auth {
    pam:enabled = true
    pam:module = hyprlock          # /etc/pam.d/hyprlock existe en este sistema

    # fprintd no está instalado; poner en true si se agrega un lector de huella
    fingerprint:enabled = false
    fingerprint:ready_message = (Escaneá tu huella para desbloquear)
    fingerprint:present_message = Leyendo huella...
    fingerprint:retry_delay = 250
}

# ------------------------------------------------------------------------- #
#  Animaciones
# ------------------------------------------------------------------------- #
animations {
    enabled = true

    bezier = smooth, 0.25, 1, 0.5, 1

    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = inputFieldColors, 1, 2, smooth
    animation = inputFieldDots, 1, 1.5, smooth
    animation = inputFieldWidth, 1, 2, smooth
}

# ------------------------------------------------------------------------- #
#  Fondo (monitor vacío = todos: eDP-1 y HDMI-A-2)
# ------------------------------------------------------------------------- #
background {
    monitor =
    path = screenshot              # captura del escritorio, desenfocada
    color = rgba(0d0d0dff)         # fallback si no hay imagen

    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.17
    vibrancy_darkness = 0.05
}

# Alternativa: usar un wallpaper fijo en lugar de la captura.
# Comentá el bloque de arriba y descomentá este.
# background {
#     monitor =
#     path = /home/barba/Pictures/Wallpapers/abstract-dark.png
#     color = rgba(0d0d0dff)
#     blur_passes = 2
#     blur_size = 7
#     brightness = 0.8
# }

# ------------------------------------------------------------------------- #
#  Reloj
# ------------------------------------------------------------------------- #
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font_ui

    position = 0, 320
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.55)
    shadow_boost = 1.2
}

# ------------------------------------------------------------------------- #
#  Fecha
# ------------------------------------------------------------------------- #
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $fg_dim
    font_size = 18
    font_family = $font_ui

    position = 0, 235
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------- #
#  Avatar
# ------------------------------------------------------------------------- #
image {
    monitor =
    path = /home/barba/.face
    size = 110
    rounding = -1                  # negativo = círculo
    border_size = 3
    border_color = $accent $accent_alt 45deg

    position = 0, 85
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.6)
}

# ------------------------------------------------------------------------- #
#  Saludo
# ------------------------------------------------------------------------- #
label {
    monitor =
    text = Hola, $USER
    color = $fg
    font_size = 20
    font_family = $font_ui

    position = 0, -10
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------- #
#  Campo de contraseña
# ------------------------------------------------------------------------- #
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 12

    dots_size = 0.25
    dots_spacing = 0.25
    dots_center = true
    dots_rounding = -1

    outer_color = $accent $accent_alt 45deg
    inner_color = $surface
    font_color = $fg
    font_family = $font_ui

    fade_on_empty = false
    fade_timeout = 2000

    placeholder_text = <i><span foreground="##bfbfbf">  Contraseña</span></i>
    hide_input = false

    check_color = $accent_alt $warn 120deg
    check_text = <i>Verificando...</i>

    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    capslock_color = $warn
    invert_numlock = false
    swap_font_color = false

    position = 0, -75
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)
}

# ------------------------------------------------------------------------- #
#  Batería (sólo en la pantalla del portátil)
# ------------------------------------------------------------------------- #
label {
    monitor = eDP-1
    text = cmd[update:30000] echo "󰁹  $(cat /sys/class/power_supply/BAT1/capacity)%  ·  $(cat /sys/class/power_supply/BAT1/status)"
    color = $fg_dim
    font_size = 14
    font_family = $font

    position = 30, 25
    halign = left
    valign = bottom
}

# ------------------------------------------------------------------------- #
#  Indicador de sesión bloqueada
# ------------------------------------------------------------------------- #
label {
    monitor =
    text = 󰌾  Sesión bloqueada
    color = $fg_dim
    font_size = 14
    font_family = $font

    position = -30, 25
    halign = right
    valign = bottom
}

