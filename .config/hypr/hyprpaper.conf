# ~/.config/hypr/hyprpaper.conf
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/

ipc = true        # necesario para `hyprctl hyprpaper wallpaper ...`
splash = false    # sin el logo de Hyprland encima del fondo

# ------------------------------------------------------------------------- #
#  MODO FIJO (activo)
#  Para cambiar de fondo: editá el path de las dos entradas y reiniciá
#  hyprpaper, o probalo en caliente con
#     hyprctl hyprpaper wallpaper ",~/Pictures/Wallpapers/otro.jpg"
# ------------------------------------------------------------------------- #
$wall = /home/barba/Pictures/Wallpapers/astronaut.png

wallpaper {
    monitor = eDP-1
    path = $wall
    fit_mode = cover
}

# monitor vacío = fallback para cualquier salida que se conecte después
# (HDMI-A-2 y demás) sin entrada propia.
wallpaper {
    monitor =
    path = $wall
    fit_mode = cover
}

