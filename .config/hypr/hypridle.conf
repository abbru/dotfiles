# ~/.config/hypr/hypridle.conf
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    # Se dispara con `loginctl lock-session` y con los eventos dbus de bloqueo.
    # El `pidof` evita levantar varias instancias de hyprlock.
    lock_cmd = pidof hyprlock || hyprlock

    # Bloquear antes de suspender / al volver, reencender las pantallas para no
    # tener que apretar una tecla dos veces.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    inhibit_sleep = 2              # 0 off / 1 normal / 2 auto / 3 lock notify
    ignore_dbus_inhibit = false    # respeta el inhibidor de Firefox, mpv, etc.
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# 2.5 min -> atenuar la pantalla (device amdgpu_bl1)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Este equipo no tiene retroiluminación de teclado (no aparece
# rgb:kbd_backlight en `brightnessctl -l`), así que no hay listener para eso.

# 5 min -> bloquear la sesión (ejecuta general:lock_cmd)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min -> apagar las pantallas
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 min -> suspender
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
