# ~/.config/hypr/hyprsunset.conf
# Referencia: https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/
#
# A diferencia de un shader, este filtro NO sale en capturas ni grabaciones.
# Cada profile se activa a su hora y resetea lo que dejaron los otros.

max-gamma = 100

# De día: sin filtro. identity ignora temperature y sólo deja actuar gamma.
profile {
    time = 7:00
    identity = true
}

# De noche: blanco cálido. Bajá temperature para más filtro (2500 = muy cálido).
profile {
    time = 20:30
    temperature = 4500
}

# El brillo lo maneja brightnessctl sobre amdgpu_bl1 desde keybindings.lua,
# así que acá no se toca gamma. Si algún día querés bajar el brillo por debajo
# del mínimo del panel, agregá `gamma = 0.8` al profile de la noche.
